[run]
base_url = "http://127.0.0.1:8099"
depth = "standard"
concurrency = 2
viewport = [1280, 900]
out = ".afford/canary"

[scope]
include = ["/**"]
exclude = ["/logout", "/signout", "/api/**"]

[auth]
mode = "form"
login_url = "/login"
success_url_contains = "/dashboard"

[safety]
allow_destructive = false
submit_forms = true

[readiness]
timeout_ms = 3000
[readiness.routes]
"/late" = "#late-ready"
"/never-ready" = "#never"

[baseline]
file = ".afford/canary/findings-baseline.json"
suppress_file = ""
