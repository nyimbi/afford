name: afford
description: Crawl a running web app, exercise every control, and fail on new findings.
inputs:
  base-url:
    description: URL of the running app.
    required: true
  config:
    description: Path to afford.toml.
    default: afford.toml
  fail-on:
    description: Lowest severity that fails the job.
    default: critical
  extra-args:
    description: Extra arguments for `afford run`.
    default: ""
  username:
    description: Login username (pass from a secret).
    required: false
  password:
    description: Login password (pass from a secret).
    required: false
outputs:
  report-dir:
    description: Directory holding report.html, report.json, junit.xml and sarif.json.
    value: ${{ steps.run.outputs.report-dir }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: "1.27"
    - name: Install afford
      shell: bash
      run: |
        go install github.com/nyimbi/afford/cmd/afford@latest
        afford install
    - name: Run afford
      id: run
      shell: bash
      env:
        AFFORD_USERNAME: ${{ inputs.username }}
        AFFORD_PASSWORD: ${{ inputs.password }}
      run: |
        out="$RUNNER_TEMP/afford"
        echo "report-dir=$out" >> "$GITHUB_OUTPUT"
        afford run --config "${{ inputs.config }}" --base-url "${{ inputs.base-url }}" \
          --no-prompt --out "$out" --fail-on "${{ inputs.fail-on }}" ${{ inputs.extra-args }}
    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: afford-report
        path: ${{ runner.temp }}/afford
